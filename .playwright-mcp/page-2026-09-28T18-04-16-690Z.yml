      - generic [ref=f6e414]:
        - generic [ref=f6e415]:
          - button "Qu'est-ce que قشابِـيتي?" [ref=f6e416]
          - paragraph [ref=f6e423]: قشابِـيتي est la première et la plus grande plateforme en ligne pour les produits artisanaux tunisiens traditionnels. Nous offrons une large gamme d'articles authentiques faits à la main, notamment des vêtements traditionnels, des accessoires et des décorations d'intérieur, tous fabriqués par des artisans qualifiés à travers la Tunisie. Notre mission est de préserver et de promouvoir l'artisanat traditionnel tout en le rendant accessible aux clients du monde entier.
        - generic [ref=f6e424]:
          - button "Comment passer une commande?" [ref=f6e425]
          - paragraph [ref=f6e432]: Passer une commande est facile ! Parcourez simplement nos produits, ajoutez des articles à votre panier et passez à la caisse. Vous devrez fournir vos informations de livraison et vos coordonnées de paiement. Une fois votre commande confirmée, vous recevrez un email de confirmation avec les détails de votre commande.
        - generic [ref=f6e433]:
          - button "Quelles options d'expédition sont disponibles?" [ref=f6e434]
          - paragraph [ref=f6e441]: Nous proposons l'expédition en Tunisie et à l'international. Les coûts d'expédition et les délais de livraison varient selon votre emplacement. Vous pouvez consulter les informations détaillées d'expédition lors du paiement. Pour les commandes en Tunisie, la livraison standard prend généralement 3 à 5 jours ouvrables.
        - generic [ref=f6e442]:
          - button "Comment puis-je suivre ma commande?" [ref=f6e443]
          - paragraph [ref=f6e450]: Une fois votre commande expédiée, vous recevrez un numéro de suivi par email. Vous pouvez utiliser ce numéro de suivi pour suivre la progression de votre colis sur notre site Web ou sur le site Web du transporteur.
        - generic [ref=f6e451]:
          - button "Quelle est votre politique de retour?" [ref=f6e452]
          - paragraph [ref=f6e459]: Nous acceptons les retours dans les 14 jours suivant la livraison pour les articles dans leur état d'origine. Veuillez contacter notre équipe de service client pour initier un retour. Les articles doivent être non portés, non lavés et dans leur emballage d'origine. Les articles personnalisés ou personnalisés peuvent ne pas être éligibles au retour.
        - generic [ref=f6e460]:
          - button "Vos produits sont-ils 100% faits à la main?" [ref=f6e461]
          - paragraph [ref=f6e468]: Oui ! Tous nos produits sont 100% faits à la main par des artisans qualifiés. Nous travaillons directement avec des artisans à travers la Tunisie pour garantir l'authenticité et la qualité. Chaque pièce est unique et fabriquée avec des techniques traditionnelles transmises de génération en génération.
