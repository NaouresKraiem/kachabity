      - generic [ref=f11e801]:
        - generic [ref=f11e802]:
          - button "Qu'est-ce que قشابِـيتي?" [ref=f11e803]
          - paragraph [ref=f11e810]: قشابِـيتي est la première et la plus grande plateforme en ligne pour les produits artisanaux tunisiens traditionnels. Nous offrons une large gamme d'articles authentiques faits à la main, notamment des vêtements traditionnels, des accessoires et des décorations d'intérieur, tous fabriqués par des artisans qualifiés à travers la Tunisie. Notre mission est de préserver et de promouvoir l'artisanat traditionnel tout en le rendant accessible aux clients du monde entier.
        - generic [ref=f11e811]:
          - button "Comment passer une commande?" [ref=f11e812]
          - paragraph [ref=f11e819]: Passer une commande est facile ! Parcourez simplement nos produits, ajoutez des articles à votre panier et passez à la caisse. Vous devrez fournir vos informations de livraison et vos coordonnées de paiement. Une fois votre commande confirmée, vous recevrez un email de confirmation avec les détails de votre commande.
        - generic [ref=f11e820]:
          - button "Quelles options d'expédition sont disponibles?" [ref=f11e821]
          - paragraph [ref=f11e828]: Nous proposons l'expédition en Tunisie et à l'international. Les coûts d'expédition et les délais de livraison varient selon votre emplacement. Vous pouvez consulter les informations détaillées d'expédition lors du paiement. Pour les commandes en Tunisie, la livraison standard prend généralement 3 à 5 jours ouvrables.
        - generic [ref=f11e829]:
          - button "Comment puis-je suivre ma commande?" [ref=f11e830]
          - paragraph [ref=f11e837]: Une fois votre commande expédiée, vous recevrez un numéro de suivi par email. Vous pouvez utiliser ce numéro de suivi pour suivre la progression de votre colis sur notre site Web ou sur le site Web du transporteur.
        - generic [ref=f11e838]:
          - button "Quelle est votre politique de retour?" [ref=f11e839]
          - paragraph [ref=f11e846]: Nous acceptons les retours dans les 14 jours suivant la livraison pour les articles dans leur état d'origine. Veuillez contacter notre équipe de service client pour initier un retour. Les articles doivent être non portés, non lavés et dans leur emballage d'origine. Les articles personnalisés ou personnalisés peuvent ne pas être éligibles au retour.
        - generic [ref=f11e847]:
          - button "Vos produits sont-ils 100% faits à la main?" [ref=f11e848]
          - paragraph [ref=f11e855]: Oui ! Tous nos produits sont 100% faits à la main par des artisans qualifiés. Nous travaillons directement avec des artisans à travers la Tunisie pour garantir l'authenticité et la qualité. Chaque pièce est unique et fabriquée avec des techniques traditionnelles transmises de génération en génération.
