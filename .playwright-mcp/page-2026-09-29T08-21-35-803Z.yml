          - paragraph [ref=f13e794]: قشابِـيتي هي أول وأكبر منصة إلكترونية للمنتجات الحرفية التونسية التقليدية. نقدم مجموعة واسعة من المنتجات الحرفية الأصيلة بما في ذلك الملابس التقليدية والإكسسوارات وديكور المنزل، كلها مصنوعة يدوياً من قبل حرفيين مهرة في جميع أنحاء تونس. مهمتنا هي الحفاظ على الحرف التقليدية وتعزيزها مع جعلها في متناول العملاء في جميع أنحاء العالم.
        - generic [ref=f13e795]:
          - button "كيف أسجل طلبية؟" [ref=f13e796]
          - paragraph [ref=f13e803]: تسجيل الطلبية سهل! ببساطة تصفح منتجاتنا، أضف العناصر إلى سلة التسوق، وانتقل إلى الدفع. ستحتاج إلى تقديم معلومات الشحن وتفاصيل الدفع. بمجرد تأكيد طلبك، ستتلقى رسالة تأكيد بالبريد الإلكتروني مع تفاصيل طلبك.
        - generic [ref=f13e804]:
          - button "ما هي خيارات الشحن المتاحة؟" [ref=f13e805]
          - paragraph [ref=f13e812]: نوفر الشحن داخل تونس ودولياً. تختلف تكاليف الشحن وأوقات التسليم حسب موقعك. يمكنك عرض معلومات الشحن التفصيلية أثناء الدفع. بالنسبة للطلبات داخل تونس، يستغرق التسليم القياسي عادة 3-5 أيام عمل.
        - generic [ref=f13e813]:
          - button "كيف يمكنني تتبع طلبيتي؟" [ref=f13e814]
          - paragraph [ref=f13e821]: بمجرد شحن طلبك، ستتلقى رقم تتبع عبر البريد الإلكتروني. يمكنك استخدام رقم التتبع هذا لمراقبة تقدم طردك على موقعنا الإلكتروني أو موقع شركة الشحن.
        - generic [ref=f13e822]:
          - button "ما هي سياسة الإرجاع الخاصة بكم؟" [ref=f13e823]
          - paragraph [ref=f13e830]: نقبل الإرجاع خلال 14 يوماً من التسليم للعناصر في حالتها الأصلية. يرجى الاتصال بفريق خدمة العملاء لدينا لبدء عملية الإرجاع. يجب أن تكون العناصر غير مستعملة وغير مغسولة وفي عبوتها الأصلية. قد لا تكون العناصر المخصصة أو الشخصية مؤهلة للإرجاع.
