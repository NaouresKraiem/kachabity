# The production server (docs/DEPLOY.md): Postgres, the NestJS API, the Next.js site, and Caddy in
# front on ports 80/443 (HTTPS certificates from Let's Encrypt, renewed by itself).
# Lives in /opt/kachabity on the server with its .env; deploy.sh sets API_IMAGE and WEB_IMAGE.
name: kachabity

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [db:/var/lib/postgresql/data]
    # The server's loopback only: reach it through an SSH tunnel (pgAdmin, the data move), never the internet.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 6

  api:
    # deploy.sh sets API_IMAGE; other commands (ps, logs, backups) use the image it tagged as current.
    image: ${API_IMAGE:-kachabity-api:current}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      PORT: "4000"
      # POSTGRES_PASSWORD must be URL-safe (letters and digits), see .env.example.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_URL: http://web:3000
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"ok\"'"]
      interval: 15s
      retries: 4
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-kachabity-web:current}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      NEST_URL: http://api:4000
    depends_on: [api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ar').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      retries: 4
      start_period: 30s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    configs: [{ source: caddyfile, target: /etc/caddy/Caddyfile }]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [web, api]

configs:
  # /api goes straight to NestJS, except /api/internal (the cache refresh, in Next.js).
  caddyfile:
    content: |
      ${SITE_DOMAIN} {
        encode zstd gzip
        handle /api/internal/* {
          reverse_proxy web:3000
        }
        handle /api/* {
          reverse_proxy api:4000
        }
        handle {
          reverse_proxy web:3000
        }
      }

volumes:
  db:
  caddy_data:
  caddy_config:
