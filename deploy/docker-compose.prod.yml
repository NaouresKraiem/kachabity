# The production server (docs/DEPLOY.md): Postgres, the NestJS API and the Cloudflare Tunnel that
# publishes the API at https://api.<domain>. Nothing listens on a public port: cloudflared opens
# an outbound connection to Cloudflare. The storefront (Next.js) is on Vercel.
# Lives in /opt/kachabity on the server with its .env; deploy.sh sets API_IMAGE.
name: kachabity

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [db:/var/lib/postgresql/data]
    # The server's loopback only: reach it through an SSH tunnel (pgAdmin, the data move), never the internet.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 6

  api:
    # deploy.sh sets API_IMAGE; other commands (ps, logs, backups) use the image it tagged as current.
    image: ${API_IMAGE:-kachabity-api:current}
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      PORT: "4000"
      # POSTGRES_PASSWORD must be URL-safe (letters and digits), see .env.example.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"ok\"'"]
      interval: 15s
      retries: 4
      start_period: 20s

  # Its ingress (api.<domain> → http://api:4000) is set by Terraform (infra/terraform/cloudflare.tf).
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [api]

volumes:
  db:
