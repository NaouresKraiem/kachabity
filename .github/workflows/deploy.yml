# Deploys the API to the server (docs/DEPLOY.md) after CI passes: builds the ARM image, pushes it to
# GitHub's container registry, then on the server (over SSH) backs up the database, applies the
# migrations and starts the new image, going back to the previous one if it isn't healthy.
# The storefront deploys on Vercel from the same push.
#
# Secrets (Settings → Environments → production): DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
# PROD_ENV (the server's .env, see deploy/.env.example). Variable: API_URL (https://api.<domain>).
name: Deploy

on:
  push:
    branches: [kachabiti-nest]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy the API
    needs: ci
    # Off until the server and secrets exist: set the repository variable DEPLOY_ENABLED=true (docs/DEPLOY.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kachabity-api" >> "$GITHUB_ENV"

      # The server is an ARM machine (Oracle Ampere A1).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Copy the server files and the .env
        env:
          HOST: deploy@${{ secrets.DEPLOY_HOST }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          scp deploy/docker-compose.prod.yml deploy/deploy.sh deploy/backup.sh "$HOST:/opt/kachabity/"
          printf '%s\n' "$PROD_ENV" | ssh "$HOST" 'umask 077 && cat > /opt/kachabity/.env && chmod +x /opt/kachabity/*.sh'

      - name: Deploy
        env:
          HOST: deploy@${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # The registry login lasts only for this deploy (the token expires with the job anyway).
          # The image name and actor are expanded here, on purpose, before going to the server.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "$HOST" "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          # shellcheck disable=SC2029
          ssh "$HOST" "trap 'docker logout ghcr.io >/dev/null' EXIT; /opt/kachabity/deploy.sh '$IMAGE:$SHA'"

      - name: Health from outside (through Cloudflare)
        env:
          API_URL: ${{ vars.API_URL }}
        if: env.API_URL != ''
        run: |
          for _ in $(seq 12); do curl -fs "$API_URL/api/health" && exit 0; sleep 5; done
          echo "The API does not answer at $API_URL" >&2
          exit 1
